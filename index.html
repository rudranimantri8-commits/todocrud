
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer"> 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">  
   <link rel="stylesheet" href="./css/style.css">
    <title> Movie crud </title>

</head>
<body>
    <div class="container">
        <div class="row pt-4">
            <div class="col-md-6">
                <a href="index.html" class="logo">
                    <img src="https://www.svgrepo.com/show/303196/netflix-2-logo.svg">
                </a>    
            </div>

            <div class="col-6 align-self-center text-right">
                <button id="addMovieBtn" class="btn btn-sm net-primary-btn"> Add Movie</button>
            </div>
        </div>
    </div>
    <div class="container-fluid">
        <div class="row mt-3" id="moviecontainer">
            <div class="col-md-3 mb-3">
                <div class="card movieCard">
                    <div class="card-header d-flex justify-content-between">
                        <h4 class="movieTitle"> 3 Ediots </h4>
                        <h5> <span class="badge badge-warning"> 5 </span></h5>
                    </div>
                    <div class="card-body">
                        <figure class="py-0">
                            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ77QZ8440lvKTHCH9qEHO_y83tKn-cSxR69AJYsj0lTPK28SNFONmORPg&s=10%22" alt="3 Ediots">
                            <figcaption>
                                <h5 class="3 Ediots three freinds"></h5>
                                <p> Lorem ipsum dolor, sit amet consect vero dolorum corrupti harum saepe recusandae non error.Lorem ipsum dolor, sit amet consect vero dolorum corrupti harum saepe </p> 
                            </figcaption>
                        </figure>
                    </div>
                     <div class="card-footer d-flex justify-content-between">
                            <button class="btn btn-sm net-sec-btn"> Edit </button>
                            <button class="btn btn-sm net-primary-btn"> Delete </button>
                     </div>
                </div>    
            </div>
        </div>
    </div>
    <div class="backdrop closeForm" id="backdrop"></div> 
    <form id="movieForm">
        <div class="card">
            <div class="card header d-flex justify-content-between">
                <h4 id="movietitle">Add Movie</h4>
                 <i role="button" id="closeFormBtn" class="fa-solid fa-xmark fa-2x closeForm"></i>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label for="MovieName"> Enter Movie Name </label>
                    <input type="text" required id="MovieName" class="form-control">
                </div>
                <div class="form-group">
                    <lable for="MovieImg"> Enter Movie Url </lable>
                    <input type="url" required id="MovieImg" class="form-control">
                </div>
                <div class="form-group">
                    <lable for="MovieDesciption"> Enter Desciption </lable>
                    <textarea type="text" required id="MovieDesciption" roes="4" class="form-control"> </textarea>
                </div>
                <div class="form-group">
                    <label for="movieRating"> Give Rating</label>
                    <select id="movieRatin" class="form-control">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>
            </div>
            <div class="card-footer d-flex justify-content-between">
                <button type="submit" id="movieAddBtn" class="btn btn-sm net-sec-btn"> Add Movie </button>
                <button type="button" id="updateMovieBtn" class="btn btn-sm net-sec-btn d-none"> Update Movie </button>
                <button type="button" id="cancel" class="btn btn-sm net-primary-btn"> Cancel </button>
            </div>
        
    </form>
  </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./js/app.js"> </script>
</body>
</html>
